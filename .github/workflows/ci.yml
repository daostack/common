  run-linters:
    name: Run linters
    runs-on: ubuntu-latest

    steps:
    - name: Check out Git repository
      uses: actions/checkout@v2

    - name: Set up Node.js
      uses: actions/setup-node@v1
      with:
        node-version: 12

    - name: Install Node.js dependencies
      run: yarn

    - name: Run linters
      uses: samuelmeuli/lint-action@v1
      with:
        eslint: true
        prettier: true
