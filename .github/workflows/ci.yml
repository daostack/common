name: Build Android and iOS
on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master
jobs:
  install-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Install dependencies
      run: |
        yarn
    - name: Run tests
      run: |
        yarn test
