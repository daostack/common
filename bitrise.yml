  setup-staging:
    steps:
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - git-clone@4: {}
    - file-downloader@1:
        inputs:
        - destination: $BITRISE_SOURCE_DIR/firebase-config.zip
        - source: $BITRISEIO_google_services_all_URL
        title: Download - all google services
    - script@1:
        inputs:
        - content: >-
            #!/usr/bin/env bash

            # fail if any commands fails

            set -e

            # debug log

            set -x


            # write your script here

            unzip firebase-config.zip


            # Android

            mv firebase-config/production/google-services.json
            $BITRISE_SOURCE_DIR/android/app/src/production/google-services.json

            mv firebase-config/staging/google-services.json
            $BITRISE_SOURCE_DIR/android/app/src/staging/google-services.json


            # iOS

            mv firebase-config/production/GoogleService-Info.plist
            $BITRISE_SOURCE_DIR/ios/firebase/production/GoogleService-Info.plist

            mv firebase-config/staging/GoogleService-Info.plist
            $BITRISE_SOURCE_DIR/ios/firebase/staging/GoogleService-Info.plist


            # or run a script from your repository, like:

            # bash ./path/to/script.sh

            # not just bash, e.g.:

            # ruby ./path/to/script.rb
        title: Set up Firebase config
