---
format_version: '8'
default_step_lib_source: 'https://github.com/bitrise-io/bitrise-steplib.git'
project_type: react-native
trigger_map:
- push_branch: master
  workflow: codepush
- push_branch: staging
  workflow: codepush-staging
- push_branch: '*'
  workflow: primary
- pull_request_source_branch: '*'
  workflow: primary
workflows:
  deploy:
    description: >
      ## Configure Android part of the deploy workflow


      To generate a signed APK:


      1. Open the **Workflow** tab of your project on Bitrise.io

      1. Add **Sign APK step right after Android Build step**

      1. Click on **Code Signing** tab

      1. Find the **ANDROID KEYSTORE FILE** section

      1. Click or drop your file on the upload file field

      1. Fill the displayed 3 input fields:

      1. **Keystore password**

      1. **Keystore alias**

      1. **Private key password**

      1. Click on **[Save metadata]** button


      That's it! From now on, **Sign APK** step will receive your uploaded
      files.


      ## Configure iOS part of the deploy workflow


      To generate IPA:


      1. Open the **Workflow** tab of your project on Bitrise.io

      1. Click on **Code Signing** tab

      1. Find the **PROVISIONING PROFILE** section

      1. Click or drop your file on the upload file field

      1. Find the **CODE SIGNING IDENTITY** section

      1. Click or drop your file on the upload file field

      1. Click on **Workflows** tab

      1. Select deploy workflow

      1. Select **Xcode Archive & Export for iOS** step

      1. Open **Force Build Settings** input group

      1. Specify codesign settings

      Set **Force code signing with Development Team**, **Force code signing
      with Code Signing Identity**  

      and **Force code signing with Provisioning Profile** inputs regarding to
      the uploaded codesigning files

      1. Specify manual codesign style

      If the codesigning files, are generated manually on the Apple Developer
      Portal,  

      you need to explicitly specify to use manual coedsign settings  

      (as ejected rn projects have xcode managed codesigning turned on).  

      To do so, add 'CODE_SIGN_STYLE="Manual"' to 'Additional options for
      xcodebuild call' input


      ## To run this workflow


      If you want to run this workflow manually:


      1. Open the app's build list page

      2. Click on **[Start/Schedule a Build]** button

      3. Select **deploy** in **Workflow** dropdown input

      4. Click **[Start Build]** button


      Or if you need this workflow to be started by a GIT event:


      1. Click on **Triggers** tab

      2. Setup your desired event (push/tag/pull) and select **deploy** workflow

      3. Click on **[Done]** and then **[Save]** buttons


      The next change in your repository that matches any of your trigger map
      event will start **deploy** workflow.
    steps:
    - git-tag@1:
        inputs:
        - tag_message: Auto deploy
        - tag: $APP_VERSION.$BITRISE_BUILD_NUMBER
    - install-missing-android-tools@2:
        inputs:
        - gradlew_path: $PROJECT_LOCATION/gradlew
    - change-android-versioncode-and-versionname@1:
        inputs:
        - build_gradle_path: $BITRISE_SOURCE_DIR/android/app/build.gradle
        - new_version_name: $APP_VERSION
    - android-build@0:
        inputs:
        - variant: ProductionRelease
        - build_type: aab
        - project_location: $PROJECT_LOCATION
    - sign-apk@1:
        inputs:
        - android_app: $BITRISE_AAB_PATH
    - google-play-deploy@3:
        inputs:
        - service_account_json_key_path: $BITRISEIO_github_actions_play_store_key_json_URL
        - user_fraction: ''
        - track: beta
        - package_name: com.daostack.common
    - set-xcode-build-number@1:
        inputs:
        - build_short_version_string: $APP_VERSION
        - plist_path: $BITRISE_PROJECT_PATH/../common/Support/Info.plist
    - set-xcode-build-number@1:
        inputs:
        - plist_path: $BITRISE_PROJECT_PATH/../common-notification-service-ext/Info.plist
        - build_short_version_string: $APP_VERSION
    - ios-auto-provision@1:
        inputs:
        - distribution_type: app-store
        - generate_profiles: 'yes'
        - team_id: 66CXPKJ7ZA
    - xcode-archive@2:
        inputs:
        - project_path: $BITRISE_PROJECT_PATH
        - scheme: $BITRISE_SCHEME
        - export_method: $BITRISE_EXPORT_METHOD
        - team_id: 66CXPKJ7ZA
        - configuration: Release
    - deploy-to-itunesconnect-application-loader@0:
        inputs:
        - itunescon_user: $AppleID
        - password: $AplleIDpassword
        - app_password: $AppleIDspecificAppPassword
    - deploy-to-bitrise-io@1: {}
    before_run:
    - setup
    meta:
      bitrise.io:
        stack: osx-xcode-12.2.x
  primary:
    steps:
    - android-build@0:
        inputs:
        - build_type: aab
        - variant: ProductionRelease
        - arguments: ''
        - project_location: $BITRISE_SOURCE_DIR/android
    - deploy-to-bitrise-io@1: {}
    before_run:
    - setup
    meta:
      bitrise.io:
        stack: osx-xcode-12.2.x
  setup:
    steps:
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - git-clone@4: {}
    - file-downloader@1:
        inputs:
        - destination: $BITRISE_SOURCE_DIR/android/app/src/production/google-services.json
        - source: $BITRISEIO_google_services_json_URL
        title: Download - google services
    - file-downloader@1:
        inputs:
        - destination: $BITRISE_SOURCE_DIR/ios/firebase/production/GoogleService-Info.plist
        - source: $BITRISEIO_GoogleService_Info_plist_URL
        title: Download - GoogleService-Info.plist
    - yarn@0:
        inputs:
        - command: install
        title: Run yarn install
    - cocoapods-install@1:
        inputs:
        - install_cocoapods_version: 1.9.3
        - verbose: 'false'
        - podfile_path: $source_root_path/ios/Podfile
    meta:
      bitrise.io:
        stack: osx-xcode-12.2.x
  codepush:
    steps:
    - script@1:
        inputs:
        - content: |-
            #!/usr/bin/env bash
            # fail if any commands fails
            set -e
            # debug log
            set -x

            # write your script here
            cd node_modules/hermes-engine/osx-bin 
            mv hermesc hermes
            cd ../../..

            # or run a script from your repository, like:
            # bash ./path/to/script.sh
            # not just bash, e.g.:
            # ruby ./path/to/script.rb
    - appcenter-codepush-release-react-native@0:
        inputs:
        - api_token: $APPCENTER_CODEPUSH_ANDROID_API
        - deployment: Production
        - options: '-t $CODEPUSH_TARGET_VERSION_PRODUCTION --mandatory'
        - app_id: $APPCENTER_APP_ID_ANDROID
    - script@1:
        inputs:
        - content: >-
            #!/usr/bin/env bash

            # fail if any commands fails

            set -e

            # debug log

            set -x


            # write your script here

            LABEL="$(node -pe 'JSON.parse(process.argv[1]).latest_release.label'
            "$(curl -X GET
            "https://api.appcenter.ms/v0.1/apps/DAOstack/common-android/deployments/Production"
            -H "accept: application/json" -H "X-API-Token:
            $APPCENTER_CODEPUSH_ANDROID_API")")"


            envman add --key ANDROID_CODEPUSH_LABEL --value $LABEL


            # or run a script from your repository, like:

            # bash ./path/to/script.sh

            # not just bash, e.g.:

            # ruby ./path/to/script.rb
    - git-tag@1:
        inputs:
        - tag: >-
            Android-CP-$CODEPUSH_TARGET_VERSION_PRODUCTION.$ANDROID_CODEPUSH_LABEL-build-$BITRISE_BUILD_NUMBER
        - tag_message: Auto codepush
    - appcenter-codepush-release-react-native@0:
        inputs:
        - api_token: $APPCENTER_CODEPUSH_IOS_API
        - deployment: Production
        - options: '-t $CODEPUSH_TARGET_VERSION_PRODUCTION --mandatory'
        - app_id: $APPCENTER_APP_ID_IOS
    - script@1:
        inputs:
        - content: >-
            #!/usr/bin/env bash

            # fail if any commands fails

            set -e

            # debug log

            set -x


            # write your script here

            LABEL="$(node -pe 'JSON.parse(process.argv[1]).latest_release.label'
            "$(curl -X GET
            "https://api.appcenter.ms/v0.1/apps/DAOstack/common-ios/deployments/Production"
            -H "accept: application/json" -H "X-API-Token:
            $APPCENTER_CODEPUSH_IOS_API")")"


            envman add --key IOS_CODEPUSH_LABEL --value $LABEL


            # or run a script from your repository, like:

            # bash ./path/to/script.sh

            # not just bash, e.g.:

            # ruby ./path/to/script.rb
    - git-tag@1:
        inputs:
        - tag: >-
            iOS-CP-$CODEPUSH_TARGET_VERSION_PRODUCTION.$IOS_CODEPUSH_LABEL-build-$BITRISE_BUILD_NUMBER
        - tag_message: Auto codepush
    before_run:
    - setup
    meta:
      bitrise.io:
        stack: osx-xcode-12.2.x
  codepush-test:
    steps:
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - git-clone@4: {}
    - file-downloader@1:
